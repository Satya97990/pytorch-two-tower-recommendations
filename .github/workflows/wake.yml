name: Wake Streamlit App

on:
  schedule:
    - cron: "0 */4 * * *" # Runs every 4 hours automatically
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pinging Streamlit App
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://pytorch-two-tower-recommendations-29tv9ggspgtbeafzb5bwqz.streamlit.app/'
          method: 'GET'